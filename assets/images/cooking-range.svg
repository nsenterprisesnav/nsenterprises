<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="t">
  <title id="t">Freestanding gas cooking range with four burners and an oven, serviced by NS Enterprises</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4f8fd"/><stop offset="1" stop-color="#e6eef8"/>
    </linearGradient>
    <pattern id="tiles" width="96" height="48" patternUnits="userSpaceOnUse">
      <rect width="96" height="48" fill="#eef4fb"/>
      <path d="M0 47.5H96M95.5 0V48" stroke="#d9e4f1" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b9c4d1"/><stop offset=".18" stop-color="#e9eef4"/><stop offset=".5" stop-color="#cdd6e0"/><stop offset=".82" stop-color="#eef2f7"/><stop offset="1" stop-color="#aab6c4"/>
    </linearGradient>
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#dfe6ee"/><stop offset="1" stop-color="#b3bfcc"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#14263b"/><stop offset=".55" stop-color="#1d3550"/><stop offset="1" stop-color="#0b1726"/>
    </linearGradient>
    <radialGradient id="ovenGlow" cx=".5" cy=".7" r=".6">
      <stop stop-color="#f3a64a" stop-opacity=".55"/><stop offset="1" stop-color="#f3a64a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#2366e8" stop-opacity="0"/><stop offset=".72" stop-color="#4f8cff" stop-opacity=".9"/><stop offset=".86" stop-color="#48d5c0" stop-opacity=".55"/><stop offset="1" stop-color="#48d5c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2a3b4f"/><stop offset="1" stop-color="#1a2a3c"/>
    </linearGradient>
    <linearGradient id="cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#e9eff6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d8c7b0"/><stop offset="1" stop-color="#c3ae93"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#183957"/><stop offset="1" stop-color="#0c1d31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#48d5c0"/><stop offset="1" stop-color="#2366e8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Room -->
  <rect width="1536" height="1024" fill="url(#wall)"/>
  <rect x="0" y="250" width="1536" height="300" fill="url(#tiles)"/>
  <rect x="0" y="870" width="1536" height="154" fill="url(#floor)"/>
  <path d="M0 870H1536" stroke="#b39d80" stroke-width="3"/>

  <!-- Window light -->
  <g opacity=".9">
    <rect x="1170" y="70" width="270" height="170" rx="10" fill="#dcecff" stroke="#c7d6e7" stroke-width="10"/>
    <path d="M1305 70V240M1170 155H1440" stroke="#c7d6e7" stroke-width="8"/>
    <path d="M1180 80l120 0-60 150h-60z" fill="#fff" opacity=".45"/>
  </g>

  <!-- Upper cabinets -->
  <g>
    <rect x="40" y="40" width="440" height="200" rx="10" fill="url(#cabinet)" stroke="#d6e0eb" stroke-width="3"/>
    <path d="M260 46V234" stroke="#d6e0eb" stroke-width="3"/>
    <rect x="236" y="170" width="8" height="46" rx="4" fill="#9aa9ba"/>
    <rect x="276" y="170" width="8" height="46" rx="4" fill="#9aa9ba"/>
  </g>

  <!-- Chimney hood above the range -->
  <g>
    <rect x="700" y="0" width="136" height="150" fill="url(#steel)"/>
    <path d="M560 150H976L1020 232H516Z" fill="url(#steel)" stroke="#9eabba" stroke-width="2"/>
    <rect x="516" y="232" width="504" height="16" rx="4" fill="#9eabba"/>
    <circle cx="930" cy="192" r="7" fill="#48d5c0"/>
  </g>

  <!-- Counters left and right -->
  <g>
    <rect x="0" y="540" width="512" height="30" fill="url(#counter)"/>
    <rect x="1024" y="540" width="512" height="30" fill="url(#counter)"/>
    <rect x="20" y="570" width="472" height="300" fill="url(#cabinet)" stroke="#d6e0eb" stroke-width="3"/>
    <path d="M256 576V864" stroke="#d6e0eb" stroke-width="3"/>
    <rect x="228" y="600" width="8" height="54" rx="4" fill="#9aa9ba"/>
    <rect x="276" y="600" width="8" height="54" rx="4" fill="#9aa9ba"/>
    <rect x="1044" y="570" width="472" height="300" fill="url(#cabinet)" stroke="#d6e0eb" stroke-width="3"/>
    <path d="M1044 690H1516" stroke="#d6e0eb" stroke-width="3"/>
    <rect x="1250" y="620" width="60" height="8" rx="4" fill="#9aa9ba"/>
    <rect x="1250" y="760" width="60" height="8" rx="4" fill="#9aa9ba"/>
  </g>

  <!-- Counter props -->
  <g>
    <rect x="120" y="470" width="70" height="70" rx="10" fill="#f3a64a"/>
    <rect x="200" y="490" width="56" height="50" rx="8" fill="#48d5c0"/>
    <path d="M1120 540c0-60 30-80 70-80s70 20 70 80z" fill="#183957"/>
    <rect x="1180" y="440" width="22" height="22" rx="4" fill="#183957"/>
    <path d="M1330 540v-90M1350 540v-110M1370 540v-80" stroke="#7a8da3" stroke-width="6" stroke-linecap="round"/>
    <rect x="1312" y="500" width="80" height="40" rx="8" fill="#ffffff" stroke="#c9d5e3" stroke-width="3"/>
  </g>

  <!-- Range shadow -->
  <ellipse cx="768" cy="880" rx="300" ry="22" fill="#0c1d31" opacity=".25" filter="url(#soft)"/>

  <!-- Cooking range body -->
  <g>
    <!-- backguard -->
    <rect x="530" y="430" width="476" height="62" rx="8" fill="url(#steel)" stroke="#9eabba" stroke-width="2"/>
    <rect x="690" y="446" width="156" height="30" rx="6" fill="#0c1d31"/>
    <text x="768" y="468" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="17" fill="#48d5c0" letter-spacing="2">12:30</text>
    <!-- cooktop -->
    <path d="M514 492H1022L1032 528H504Z" fill="url(#steelTop)" stroke="#8f9dad" stroke-width="2"/>
    <!-- main body -->
    <rect x="512" y="528" width="512" height="340" fill="url(#steel)" stroke="#8f9dad" stroke-width="2"/>
    <!-- control strip -->
    <rect x="512" y="528" width="512" height="66" fill="#1a2b3f"/>
    <g fill="#e9eef4" stroke="#7d8b9b" stroke-width="2">
      <circle cx="582" cy="561" r="20"/><circle cx="662" cy="561" r="20"/><circle cx="742" cy="561" r="20"/><circle cx="822" cy="561" r="20"/><circle cx="954" cy="561" r="20"/>
    </g>
    <g stroke="#10263f" stroke-width="5" stroke-linecap="round">
      <path d="M582 561l0-14"/><path d="M662 561l10-10"/><path d="M742 561l0-14"/><path d="M822 561l-10-10"/><path d="M954 561l12 6"/>
    </g>
    <circle cx="888" cy="561" r="6" fill="#48d5c0"/>
    <!-- oven door -->
    <rect x="534" y="610" width="468" height="200" rx="10" fill="#d4dce5" stroke="#8f9dad" stroke-width="2"/>
    <rect x="530" y="616" width="476" height="16" rx="8" fill="#eef2f7" stroke="#8f9dad" stroke-width="2"/>
    <rect x="584" y="652" width="368" height="138" rx="12" fill="url(#glass)"/>
    <rect x="584" y="652" width="368" height="138" rx="12" fill="url(#ovenGlow)"/>
    <path d="M604 740H932" stroke="#5b6f86" stroke-width="4"/>
    <path d="M604 720H932" stroke="#3b4f66" stroke-width="2"/>
    <ellipse cx="768" cy="732" rx="80" ry="16" fill="#3a2a1d" opacity=".75"/>
    <ellipse cx="768" cy="724" rx="62" ry="14" fill="#b86b2c"/>
    <path d="M600 664l70 0-40 110h-40z" fill="#fff" opacity=".08"/>
    <!-- bottom drawer -->
    <rect x="534" y="822" width="468" height="38" rx="6" fill="#c4cdd8" stroke="#8f9dad" stroke-width="2"/>
    <rect x="718" y="834" width="100" height="10" rx="5" fill="#8f9dad"/>
    <!-- feet -->
    <rect x="530" y="866" width="30" height="10" fill="#475769"/><rect x="976" y="866" width="30" height="10" fill="#475769"/>
  </g>

  <!-- Burners and pan supports (perspective) -->
  <g>
    <!-- flames on two front burners -->
    <ellipse cx="640" cy="514" rx="70" ry="16" fill="url(#flame)"/>
    <ellipse cx="896" cy="514" rx="70" ry="16" fill="url(#flame)"/>
    <g fill="#1d2c3d">
      <ellipse cx="640" cy="514" rx="36" ry="8"/><ellipse cx="896" cy="514" rx="36" ry="8"/>
      <ellipse cx="680" cy="500" rx="28" ry="6"/><ellipse cx="856" cy="500" rx="28" ry="6"/>
    </g>
    <g fill="#c0a04a">
      <ellipse cx="640" cy="512" rx="18" ry="4"/><ellipse cx="896" cy="512" rx="18" ry="4"/>
      <ellipse cx="680" cy="499" rx="14" ry="3"/><ellipse cx="856" cy="499" rx="14" ry="3"/>
    </g>
    <g stroke="#0c1d31" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M560 522H1000"/><path d="M590 497H946"/>
      <path d="M578 522L600 497M700 522L716 497M768 522V497M836 522L820 497M958 522L936 497"/>
    </g>
    <!-- flame tongues -->
    <g fill="#4f8cff" opacity=".9">
      <path d="M612 508q4-14 8 0z"/><path d="M630 506q4-16 8 0z"/><path d="M648 506q4-16 8 0z"/><path d="M664 508q4-14 8 0z"/>
      <path d="M868 508q4-14 8 0z"/><path d="M886 506q4-16 8 0z"/><path d="M904 506q4-16 8 0z"/><path d="M920 508q4-14 8 0z"/>
    </g>
  </g>

  <!-- Pressure cooker on front-right burner -->
  <g>
    <path d="M852 446h88l6 64h-100z" fill="url(#steel)" stroke="#8f9dad" stroke-width="2"/>
    <ellipse cx="896" cy="446" rx="46" ry="9" fill="#dfe6ee" stroke="#8f9dad" stroke-width="2"/>
    <rect x="888" y="424" width="16" height="20" rx="4" fill="#1a2b3f"/>
    <rect x="938" y="452" width="62" height="11" rx="5.5" fill="#1a2b3f"/>
  </g>

  <!-- Technician toolkit -->
  <g>
    <rect x="1080" y="760" width="250" height="120" rx="14" fill="url(#box)"/>
    <rect x="1080" y="760" width="250" height="10" rx="5" fill="url(#accent)"/>
    <path d="M1160 760v-28a12 12 0 0 1 12-12h66a12 12 0 0 1 12 12v28" fill="none" stroke="#183957" stroke-width="12"/>
    <text x="1205" y="826" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="1">NS Enterprises</text>
    <text x="1205" y="852" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="13" fill="#9fb4cc" letter-spacing="3">APPLIANCE SERVICE</text>
    <!-- screwdriver and spanner on floor -->
    <g transform="rotate(-12 1400 900)">
      <rect x="1350" y="890" width="58" height="18" rx="9" fill="#f3a64a"/>
      <rect x="1406" y="895" width="70" height="8" rx="3" fill="#9aa9ba"/>
    </g>
    <g transform="rotate(18 1420 950)">
      <rect x="1360" y="942" width="120" height="14" rx="7" fill="#7d8b9b"/>
      <circle cx="1360" cy="949" r="16" fill="#7d8b9b"/><circle cx="1360" cy="949" r="7" fill="#c3ae93"/>
    </g>
  </g>

  <!-- Service badge -->
  <g transform="translate(70 640)">
    <rect width="360" height="150" rx="22" fill="#ffffff" stroke="#e2eaf4" stroke-width="2"/>
    <rect x="22" y="26" width="56" height="56" rx="16" fill="#edf3ff"/>
    <path d="M38 66c0-14 12-18 12-30 8 8 16 16 16 30a14 14 0 0 1-28 0z" fill="#2366e8"/>
    <path d="M46 68c0-6 5-8 5-14 4 4 7 8 7 14a6 6 0 0 1-12 0z" fill="#48d5c0"/>
    <text x="96" y="52" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="24" fill="#10263f">Cooking Range</text>
    <text x="96" y="80" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="16" fill="#66778b">Burner, oven &amp; ignition</text>
    <text x="22" y="124" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="15" fill="#2366e8" letter-spacing="2">DOORSTEP SERVICE · HYDERABAD</text>
  </g>
</svg>
